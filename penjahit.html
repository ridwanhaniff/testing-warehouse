<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ina Basic Store · Portal Laporan Penjahit</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --primary-hover: #374151;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; -webkit-tap-highlight-color: transparent; }

    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px;
    }
    .brand-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .brand-sub { font-size: 11px; color: var(--muted); }

    .sync-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600;
      padding: 5px 10px; border-radius: 999px;
      background: var(--bg); color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .sync-pill.loading .sync-dot { background: var(--warning); animation: pulse 1s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    .container { max-width: 520px; margin: 16px auto; padding: 0 14px; display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-title { font-size: 14px; font-weight: 700; color: var(--text); }

    .form-group { margin-bottom: 14px; }
    .form-group:last-child { margin-bottom: 0; }
    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .req { color: var(--danger); }

    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    input:disabled, select:disabled { background: #f9fafb; color: var(--muted); cursor: not-allowed; }

    .wo-info-box {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid #bfdbfe;
      display: none;
    }
    .wo-info-box.active { display: block; }
    .wo-info-title { font-size: 13px; font-weight: 700; color: #1e40af; margin-bottom: 4px; }
    .wo-info-meta { font-size: 12px; color: #1e3a8a; line-height: 1.45; }
    .wo-progress-wrap { margin-top: 8px; }
    .wo-progress-bar { height: 7px; background: #dbeafe; border-radius: 999px; overflow: hidden; }
    .wo-progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }
    .wo-progress-text { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #1e40af; margin-top: 4px; }

    .qty-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .qty-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #fafafa;
    }
    .qty-card.good { border-color: #a7f3d0; background: var(--success-soft); }
    .qty-card.bad { border-color: #fecaca; background: var(--danger-soft); }
    .qty-card label { margin-bottom: 6px; font-size: 12px; }
    .qty-card.good label { color: #065f46; }
    .qty-card.bad label { color: #991b1b; }
    .qty-card input { font-size: 18px; font-weight: 700; text-align: center; padding: 10px; }

    .btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn.is-loading .spinner { display: inline-block; }

    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
      font-weight: 500;
    }
    .alert.show { display: block; }
    .alert.success { background: var(--success-soft); color: #065f46; border: 1px solid #a7f3d0; }
    .alert.error { background: var(--danger-soft); color: #991b1b; border: 1px solid #fecaca; }

    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .history-left strong { display: block; font-size: 13px; color: var(--text); }
    .history-left span { color: var(--muted); font-size: 11px; }
    .history-badge {
      padding: 4px 8px; border-radius: 6px;
      background: var(--warning-soft); color: #92400e;
      font-weight: 700; font-size: 11px;
    }
    .empty-state { text-align: center; padding: 16px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">IBS</div>
      <div>
        <div class="brand-title">Portal Laporan Jahit</div>
        <div class="brand-sub">Ina Basic Store · Produksi</div>
      </div>
    </div>
    <button type="button" id="btnSync" class="sync-pill" onclick="refreshActiveWo(true)">
      <span class="sync-dot"></span>
      <span id="syncText">Siap</span>
    </button>
  </header>

  <main class="container">
    <div id="alertBox" class="alert"></div>

    <form id="formLaporan" class="card" onsubmit="handleSubmitLaporan(event)">
      <div class="card-header">
        <div class="card-title">Setor Hasil Jahitan Harian</div>
      </div>

      <div class="form-group">
        <label for="namaPenjahit">Nama Penjahit / Tim <span class="req">*</span></label>
        <input type="text" id="namaPenjahit" placeholder="Contoh: Kang Asep / Tim Jahit 1" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="selectWo">Pilih Sesi Work Order (WO) Aktif <span class="req">*</span></label>
        <select id="selectWo" required onchange="onSelectWoChange()">
          <option value="">Memuat daftar WO aktif...</option>
        </select>

        <div id="woInfoBox" class="wo-info-box">
          <div id="woInfoTitle" class="wo-info-title"></div>
          <div id="woInfoMeta" class="wo-info-meta"></div>
          <div class="wo-progress-wrap">
            <div class="wo-progress-bar">
              <div id="woProgressFill" class="wo-progress-fill" style="width: 0%"></div>
            </div>
            <div class="wo-progress-text">
              <span id="woProgressLeft">Masuk: 0 pcs</span>
              <span id="woProgressRight">Sisa target: 0 pcs</span>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <div class="qty-grid">
          <div class="qty-card good">
            <label for="qtyBagus">Hasil Bagus (Pcs) <span class="req">*</span></label>
            <input type="number" id="qtyBagus" min="0" inputmode="numeric" placeholder="0" required />
          </div>
          <div class="qty-card bad">
            <label for="qtyCacat">Cacat / Reject (Pcs)</label>
            <input type="number" id="qtyCacat" min="0" inputmode="numeric" value="0" />
          </div>
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-primary">
        <span class="spinner"></span>
        <span id="btnSubmitText">Kirim Laporan ke QC</span>
      </button>
    </form>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Riwayat Kiriman Hari Ini (Perangkat Ini)</div>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty-state">Belum ada laporan dikirim hari ini.</div>
      </div>
    </div>
  </main>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA JIKA DI-HOSTING TERPISAH
    const API_URL = 'PASTE_WEB_APP_URL_ANDA_DISINI';

    const CACHE_KEY_WO = 'IBS_PENJAHIT_ACTIVE_WO_V5';
    const CACHE_KEY_NAME = 'IBS_PENJAHIT_LAST_NAME_V5';
    const CACHE_KEY_HISTORY = 'IBS_PENJAHIT_HISTORY_V5';

    let activeWoList = [];
    let isSubmitting = false;
    let isSyncing = false;

    function getEndpointUrl() {
      if (API_URL && API_URL !== 'PASTE_WEB_APP_URL_ANDA_DISINI') return API_URL;
      return window.location.href.split('?')[0];
    }

    async function callApi(payload) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 25000);
      try {
        const res = await fetch(getEndpointUrl(), {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        const data = await res.json();
        return data;
      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') {
          throw new Error('Koneksi lambat (timeout). Silakan periksa sinyal dan coba lagi.');
        }
        throw err;
      }
    }

    function showAlert(type, msg) {
      const box = document.getElementById('alertBox');
      box.className = 'alert show ' + type;
      box.textContent = msg;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function hideAlert() {
      document.getElementById('alertBox').className = 'alert';
    }

    function setSyncState(loading, label) {
      isSyncing = loading;
      const pill = document.getElementById('btnSync');
      const txt = document.getElementById('syncText');
      pill.classList.toggle('loading', loading);
      txt.textContent = label || (loading ? 'Sinkron...' : 'Terhubung');
    }

    function setSubmitLoading(loading) {
      isSubmitting = loading;
      const btn = document.getElementById('btnSubmit');
      const txt = document.getElementById('btnSubmitText');
      const inputs = document.querySelectorAll('#formLaporan input, #formLaporan select');
      btn.disabled = loading;
      btn.classList.toggle('is-loading', loading);
      txt.textContent = loading ? 'Mengirim Laporan...' : 'Kirim Laporan ke QC';
      inputs.forEach(el => { el.disabled = loading; });
    }

    function renderWoOptions(list) {
      const select = document.getElementById('selectWo');
      const prevSelected = select.value;

      // Filter ketat hanya WO yang masih aktif dan belum selesai
      activeWoList = (list || []).filter(w => {
        const st = String(w.status || '').toUpperCase();
        return st !== 'SELESAI' && st !== 'BATAL' && st !== 'CLOSED';
      });

      select.innerHTML = '';
      if (!activeWoList.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '-- Tidak ada sesi WO aktif saat ini --';
        select.appendChild(opt);
        onSelectWoChange();
        return;
      }

      const defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = '-- Pilih Nomor WO (' + activeWoList.length + ' sesi aktif) --';
      select.appendChild(defaultOpt);

      activeWoList.forEach(wo => {
        const opt = document.createElement('option');
        opt.value = wo.wo_id;
        opt.textContent = `${wo.nomor_wo} · ${wo.tim_label} (Sisa ${wo.sisa_qty} pcs)`;
        select.appendChild(opt);
      });

      if (prevSelected && activeWoList.some(w => w.wo_id === prevSelected)) {
        select.value = prevSelected;
      }
      onSelectWoChange();
    }

    function onSelectWoChange() {
      const woId = document.getElementById('selectWo').value;
      const box = document.getElementById('woInfoBox');
      const wo = activeWoList.find(w => w.wo_id === woId);

      if (!wo) {
        box.classList.remove('active');
        return;
      }

      const target = Number(wo.target_qty) || 0;
      const masuk = Number(wo.masuk_qty) || 0;
      const sisa = Number(wo.sisa_qty) || 0;
      const pct = target > 0 ? Math.min(100, Math.round((masuk / target) * 100)) : 0;

      document.getElementById('woInfoTitle').textContent = `${wo.nomor_wo} · ${wo.tim_label}`;
      document.getElementById('woInfoMeta').textContent = `Target Item: ${wo.target_summary || '-'} | Rak Tujuan: ${wo.lokasi_tujuan || 'Rak Utama'}`;
      document.getElementById('woProgressFill').style.width = pct + '%';
      document.getElementById('woProgressLeft').textContent = `Tersetor: ${masuk} / ${target} pcs (${pct}%)`;
      document.getElementById('woProgressRight').textContent = `Sisa: ${sisa} pcs`;
      box.classList.add('active');
    }

    async function refreshActiveWo(manual = false) {
      if (isSyncing || isSubmitting) return;
      // Jangan timpa pilihan user saat sedang fokus mengisi form kecuali manual refresh
      const activeEl = document.activeElement;
      if (!manual && activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT')) {
        return;
      }

      setSyncState(true, 'Sinkron...');
      try {
        const res = await callApi({ action: 'GET_ACTIVE_WO' });
        if (res && res.success && res.data) {
          const list = res.data.wo_list || [];
          localStorage.setItem(CACHE_KEY_WO, JSON.stringify(list));
          renderWoOptions(list);
          setSyncState(false, 'Terhubung');
        } else {
          setSyncState(false, 'Gagal sinkron');
        }
      } catch (e) {
        setSyncState(false, 'Mode Offline');
      }
    }

    function saveLocalHistory(item) {
      const today = new Date().toISOString().slice(0, 10);
      let items = [];
      try {
        const raw = JSON.parse(localStorage.getItem(CACHE_KEY_HISTORY) || '[]');
        items = raw.filter(x => x.date === today);
      } catch (e) {}
      items.unshift({ ...item, date: today });
      localStorage.setItem(CACHE_KEY_HISTORY, JSON.stringify(items.slice(0, 20)));
      renderLocalHistory();
    }

    function renderLocalHistory() {
      const container = document.getElementById('historyList');
      const today = new Date().toISOString().slice(0, 10);
      let items = [];
      try {
        items = JSON.parse(localStorage.getItem(CACHE_KEY_HISTORY) || '[]').filter(x => x.date === today);
      } catch (e) {}

      if (!items.length) {
        container.innerHTML = '<div class="empty-state">Belum ada laporan dikirim hari ini.</div>';
        return;
      }

      container.innerHTML = items.map(it => `
        <div class="history-item">
          <div class="history-left">
            <strong>${it.nomor_wo} · ${it.nama_penjahit}</strong>
            <span>${it.waktu} · Bagus: ${it.qty_bagus} pcs, Cacat: ${it.qty_cacat} pcs</span>
          </div>
          <span class="history-badge">MENUNGGU QC</span>
        </div>
      `).join('');
    }

    async function handleSubmitLaporan(e) {
      e.preventDefault();
      if (isSubmitting) return;
      hideAlert();

      const namaPenjahit = document.getElementById('namaPenjahit').value.trim();
      const woId = document.getElementById('selectWo').value;
      const qtyBagus = parseInt(document.getElementById('qtyBagus').value, 10) || 0;
      const qtyCacat = parseInt(document.getElementById('qtyCacat').value, 10) || 0;

      if (!namaPenjahit) {
        showAlert('error', 'Nama penjahit wajib diisi.');
        return;
      }
      if (!woId) {
        showAlert('error', 'Pilih sesi Work Order (WO) yang masih aktif.');
        return;
      }
      if ((qtyBagus + qtyCacat) <= 0) {
        showAlert('error', 'Jumlah jahitan (Bagus atau Cacat) minimal 1 pcs.');
        return;
      }

      const selectedWo = activeWoList.find(w => w.wo_id === woId);
      const trxId = 'JHT-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();

      localStorage.setItem(CACHE_KEY_NAME, namaPenjahit);
      setSubmitLoading(true);

      try {
        const res = await callApi({
          action: 'SUBMIT_LAPORAN_JAHIT',
          transaction_id: trxId,
          wo_id: woId,
          nomor_wo: selectedWo ? selectedWo.nomor_wo : '',
          nama_penjahit: namaPenjahit,
          qty_bagus: qtyBagus,
          qty_cacat: qtyCacat
        });

        if (res && res.success) {
          showAlert('success', res.message || 'Laporan jahit berhasil dikirim ke bagian QC!');
          saveLocalHistory({
            nomor_wo: selectedWo ? selectedWo.nomor_wo : woId,
            nama_penjahit: namaPenjahit,
            qty_bagus: qtyBagus,
            qty_cacat: qtyCacat,
            waktu: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
          });

          document.getElementById('qtyBagus').value = '';
          document.getElementById('qtyCacat').value = '0';

          // Muat ulang daftar WO agar progres terbaru langsung ter-update
          setSubmitLoading(false);
          await refreshActiveWo(true);
        } else {
          showAlert('error', (res && res.message) || 'Gagal mengirim laporan. Silakan coba lagi.');
          setSubmitLoading(false);
        }
      } catch (err) {
        showAlert('error', err.message || 'Terjadi gangguan jaringan saat mengirim laporan.');
        setSubmitLoading(false);
      }
    }

    // Inisialisasi instan dari cache lokal sebelum fetch server
    (function init() {
      const savedName = localStorage.getItem(CACHE_KEY_NAME);
      if (savedName) document.getElementById('namaPenjahit').value = savedName;

      try {
        const cachedWo = JSON.parse(localStorage.getItem(CACHE_KEY_WO) || '[]');
        if (cachedWo.length) renderWoOptions(cachedWo);
      } catch (e) {}

      renderLocalHistory();
      refreshActiveWo(true);

      // Auto-reload cerdas setiap 30 detik di latar belakang
      setInterval(() => refreshActiveWo(false), 30000);
    })();
  </script>
</body>
</html>
